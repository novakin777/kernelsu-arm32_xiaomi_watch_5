name: Build ARM32 KernelSU Manager

on:
  push:
    branches:
      - codex/blenny-arm32-sigsys-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm32-manager:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust
        run: |
          rustup update stable
          rustup target add armv7-linux-androideabi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Build ARM32 ksud
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          LLVM_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ARM_CLANG="$LLVM_BIN/armv7a-linux-androideabi26-clang"
          test -x "$ARM_CLANG"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$ARM_CLANG"
          export CC_armv7_linux_androideabi="$ARM_CLANG"
          export CXX_armv7_linux_androideabi="${ARM_CLANG}++"
          export AR_armv7_linux_androideabi="$LLVM_BIN/llvm-ar"
          export BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi="--sysroot=$LLVM_BIN/../sysroot -I$LLVM_BIN/../sysroot/usr/include/arm-linux-androideabi"
          cargo build --locked --target armv7-linux-androideabi --release --manifest-path userspace/ksud/Cargo.toml
          "$LLVM_BIN/llvm-readelf" -h target/armv7-linux-androideabi/release/ksud | grep 'Class:.*ELF32'
          "$LLVM_BIN/llvm-readelf" -h target/armv7-linux-androideabi/release/ksud | grep 'Machine:.*ARM'
          mkdir -p manager/app/src/main/jniLibs/armeabi-v7a
          cp target/armv7-linux-androideabi/release/ksud manager/app/src/main/jniLibs/armeabi-v7a/libksud.so

      - name: Setup Java and Gradle
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create temporary APK signing key
        working-directory: manager
        run: |
          STORE_PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -alias arm32-test -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass "$STORE_PASS" -keypass "$STORE_PASS" -dname "CN=KernelSU ARM32 test" \
            -keystore arm32-test.jks
          {
            echo "KEYSTORE_FILE=arm32-test.jks"
            echo "KEYSTORE_PASSWORD=$STORE_PASS"
            echo "KEY_ALIAS=arm32-test"
            echo "KEY_PASSWORD=$STORE_PASS"
          } >> gradle.properties

      - name: Build ARM32 manager APK
        working-directory: manager
        run: ./gradlew clean assembleRelease -PKSU_PACKAGE_NAME=me.weishu.kernelsu.arm32test -PKSU_NAME="KernelSU ARM32 test"

      - name: Verify APK payload
        working-directory: manager
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          unzip -l "$APK" | grep 'lib/armeabi-v7a/libksud.so'
          unzip -p "$APK" lib/armeabi-v7a/libksud.so > /tmp/libksud.so
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h /tmp/libksud.so | grep 'Class:.*ELF32'
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h /tmp/libksud.so | grep 'Machine:.*ARM'

      - name: Upload APK and ksud
        uses: actions/upload-artifact@v7
        with:
          name: kernelsu-arm32-sigsys-fix
          path: |
            manager/app/build/outputs/apk/release/*.apk
            manager/app/src/main/jniLibs/armeabi-v7a/libksud.so
